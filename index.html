<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MOBA Mini - MLBB Like</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none}
  body{background:#0f1a0f;overflow:hidden;font-family:sans-serif}
  #gameCanvas{width:100vw;height:100vh;display:block;background: #1a2f1a;}
  #ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
  #topBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:6px 20px;border-radius:20px;font-weight:bold;pointer-events:auto}
  #joystick{position:absolute;bottom:30px;left:30px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%;pointer-events:auto;border:2px solid rgba(255,255,255,0.2)}
  #stick{position:absolute;width:50px;height:50px;background:rgba(255,255,255,0.6);border-radius:50%;left:35px;top:35px}
  #skills{position:absolute;bottom:30px;right:20px;display:flex;gap:12px;pointer-events:auto;flex-wrap:wrap;width:150px;justify-content:flex-end}
 .skill{width:60px;height:60px;border-radius:50%;border:3px solid gold;background:radial-gradient(#444,#111);color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 0 10px rgba(255,215,0,0.5)}
 .skill:active{transform:scale(0.9)}
 .cd{opacity:0.5}
  #hpBar{position:absolute;top:50px;left:20px;width:200px;height:14px;background:#333;border:2px solid #000;border-radius:10px;overflow:hidden}
  #hpFill{width:100%;height:100%;background:linear-gradient(90deg,#0f0,#0a0)}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="topBar">MUSUH TOWER: <span id="enemyHp">100</span>% | KAMU: <span id="kill">0</span> Kill</div>
  <div id="hpBar"><div id="hpFill"></div></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="skills">
    <div class="skill" id="s3" style="border-color:#ff4444;background:radial-gradient(#ff6666,#990000)">ULTI</div>
    <div class="skill" id="s2" style="border-color:#4444ff">STUN</div>
    <div class="skill" id="s1" style="border-color:#44ff44">DASH</div>
    <div class="skill" id="atk" style="border-color:#ffff44;width:70px;height:70px">HIT</div>
  </div>
</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth; canvas.height=innerHeight;
let hero={x:200,y:canvas.height/2,hp:100,maxHp:100,speed:4,r:18,atk:15};
let enemyTower={x:canvas.width-120,y:canvas.height/2-40,w:80,h:80,hp:100};
let myTower={x:80,y:canvas.height/2-40,w:80,h:80,hp:100};
let enemies=[], minions=[], projectiles=[], particles=[];
let keys={jx:0,jy:0}; let kills=0; let lastMinion=0;

function spawnMinion(isEnemy){
  let y=canvas.height/2 + (Math.random()-0.5)*120;
  let m={x:isEnemy?canvas.width-150:150, y:y, hp:30, isEnemy:isEnemy, speed:1+Math.random(), r:10, atk:2, cooldown:0};
  (isEnemy?enemies:minions).push(m);
}

// Joystick
const joy=document.getElementById('joystick'), stick=document.getElementById('stick');
let joyActive=false;
joy.addEventListener('touchstart',e=>{joyActive=true});
joy.addEventListener('touchmove',e=>{
  if(!joyActive) return;
  let rect=joy.getBoundingClientRect();
  let tx=e.touches[0].clientX-rect.left-60;
  let ty=e.touches[0].clientY-rect.top-60;
  let dist=Math.sqrt(tx*tx+ty*ty);
  if(dist>45){tx=tx/dist*45; ty=ty/dist*45}
  stick.style.left=35+tx+'px'; stick.style.top=35+ty+'px';
  keys.jx=tx/45; keys.jy=ty/45;
});
joy.addEventListener('touchend',()=>{joyActive=false; stick.style.left='35px'; stick.style.top='35px'; keys.jx=0;keys.jy=0});

// Skills
let cds={atk:0,s1:0,s2:0,s3:0};
function useSkill(id){
  if(cds[id]>0) return;
  if(id==='atk'){ projectiles.push({x:hero.x+20,y:hero.y,dx:8,dy:0,dmg:hero.atk,enemy:true,r:6}); cds.atk=20; }
  if(id==='s1'){ hero.x+=keys.jx*80+ (keys.jx==0?80:0); hero.y+=keys.jy*80; cds.s1=120; burst(hero.x,hero.y,'#44ff44'); }
  if(id==='s2'){ enemies.forEach(e=>{ if(dist(hero,e)<120){ e.stun=90; } }); minions.forEach(m=>{if(!m.isEnemy && dist(hero,m)<120) return; if(dist(hero,m)<120) m.stun=90;}); burst(hero.x,hero.y,'#4444ff',120); cds.s2=300; }
  if(id==='s3'){ for(let i=-2;i<=2;i++) projectiles.push({x:hero.x,y:hero.y+i*20,dx:10,dy:0,dmg:40,enemy:true,r:10}); cds.s3=600; }
}
document.getElementById('atk').addEventListener('touchstart',()=>useSkill('atk'));
document.getElementById('s1').addEventListener('touchstart',()=>useSkill('s1'));
document.getElementById('s2').addEventListener('touchstart',()=>useSkill('s2'));
document.getElementById('s3').addEventListener('touchstart',()=>useSkill('s3'));

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function burst(x,y,color='#fff',rad=40){ for(let i=0;i<15;i++) particles.push({x,y,dx:(Math.random()-0.5)*8,dy:(Math.random()-0.5)*8,life:20,color}); }

function loop(){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // map
  ctx.fillStyle='#2a4a2a'; ctx.fillRect(0,canvas.height/2-100,canvas.width,200);
  ctx.strokeStyle='#3a5a3a'; ctx.lineWidth=2; ctx.strokeRect(0,canvas.height/2-100,canvas.width,200);
  // towers
  ctx.fillStyle='#4488ff'; ctx.fillRect(myTower.x,myTower.y,myTower.w,myTower.h); ctx.fillStyle='#fff'; ctx.fillText('MY BASE',myTower.x+5,myTower.y-10);
  ctx.fillStyle='#ff4444'; ctx.fillRect(enemyTower.x,enemyTower.y,enemyTower.w,enemyTower.h); ctx.fillStyle='#fff'; ctx.fillText('ENEMY',enemyTower.x+10,enemyTower.y-10);

  // hero move
  hero.x+=keys.jx*hero.speed; hero.y+=keys.jy*hero.speed;
  hero.x=Math.max(30,Math.min(canvas.width-30,hero.x)); hero.y=Math.max(30,Math.min(canvas.height-30,hero.y));

  // spawn
  if(Date.now()-lastMinion>2500){ spawnMinion(false); spawnMinion(true); lastMinion=Date.now(); }

  // update minions/enemies
  [...minions,...enemies].forEach(m=>{
    if(m.stun){m.stun--; return;}
    let target = m.isEnemy? myTower : enemyTower;
    let dx=target.x - m.x, dy=(canvas.height/2 - m.y)*0.02;
    m.x+= Math.sign(dx)*m.speed*0.5; m.y+=dy;
    // attack tower
    if(Math.abs(m.x-target.x)<60){ target.hp-=0.05; if(target.hp<=0){ if(!m.isEnemy){ document.getElementById('enemyHp').innerText='0'; alert('MENANG! Tower musuh hancur!'); location.reload(); } else { alert('KALAH! Base kamu hancur!'); location.reload(); } } }
    // attack hero
    if(dist(m,hero)< m.r+hero.r+5 && m.cooldown<=0){ hero.hp-=m.atk; m.cooldown=60; burst(hero.x,hero.y,'#ff0000'); if(hero.hp<=0){ alert('Kamu mati! Respawn'); hero.hp=hero.maxHp; hero.x=200; } }
    if(m.cooldown>0) m.cooldown--;
  });

  // projectiles
  projectiles.forEach((p,i)=>{
    p.x+=p.dx; p.y+=p.dy;
    if(p.x>canvas.width||p.x<0) projectiles.splice(i,1);
    enemies.forEach((e,ei)=>{ if(dist(p,e)<20){ e.hp-=p.dmg; burst(e.x,e.y,'#ffaaaa'); projectiles.splice(i,1); if(e.hp<=0){ enemies.splice(ei,1); kills++; document.getElementById('kill').innerText=kills; } } });
    if(dist(p,enemyTower)<50){ enemyTower.hp-=p.dmg*0.5; document.getElementById('enemyHp').innerText=Math.floor(enemyTower.hp); burst(p.x,p.y,'#ff4444'); projectiles.splice(i,1); }
  });

  // draw minions
  minions.forEach(m=>{ ctx.fillStyle='#66aaff'; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill(); });
  enemies.forEach(m=>{ ctx.fillStyle=m.stun?'#8888ff':'#ff6666'; ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill(); });

  // hero
  ctx.fillStyle='#00ff88'; ctx.shadowColor='#00ff88'; ctx.shadowBlur=15; ctx.beginPath(); ctx.arc(hero.x,hero.y,hero.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;

  // projectiles draw
  ctx.fillStyle='#ffff00'; projectiles.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });

  // particles
  particles.forEach((pt,i)=>{ pt.x+=pt.dx; pt.y+=pt.dy; pt.life--; ctx.fillStyle=pt.color; ctx.fillRect(pt.x,pt.y,4,4); if(pt.life<=0) particles.splice(i,1); });

  // cd
  for(let k in cds){ if(cds[k]>0){ cds[k]--; document.getElementById(k).classList.add('cd'); document.getElementById(k).innerText=Math.ceil(cds[k]/60); } else { document.getElementById(k).classList.remove('cd'); document.getElementById(k).innerText=k==='atk'?'HIT':k.toUpperCase(); } }
  document.getElementById('hpFill').style.width=hero.hp+'%';
  document.getElementById('s3').innerText=cds.s3>0?Math.ceil(cds.s3/60):'ULTI';
}
loop();
window.addEventListener('resize',()=>{canvas.width=innerWidth; canvas.height=innerHeight;});
</script>
</body>
  </html>
