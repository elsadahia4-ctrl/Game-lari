<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lari Terus!</title><style>body{margin:0;background:#87CEEB;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif}canvas{background:#fff;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.2)}#info{margin-top:10px;font-weight:bold}</style></head><body><h2>LARI² 🏃</h2><canvas id="game" width="360" height="640"></canvas><div id="info">Tap / Spasi = Lompat | Skor: <span id="score">0</span></div><script>const canvas=document.getElementById('game');const ctx=canvas.getContext('2d');const scoreEl=document.getElementById('score');let player={x:50,y:500,w:30,h:30,vy:0,onGround:true};let gravity=0.7;let obstacles=[];let score=0;let speed=5;let gameOver=false;let frame=0;function spawnObstacle(){let h=30+Math.random()*30;obstacles.push({x:360,y:530-h,w:25,h:h})}function reset(){player.y=500;player.vy=0;obstacles=[];score=0;speed=5;gameOver=false;frame=0}function update(){if(gameOver)return;frame++;if(frame%90===0)spawnObstacle();player.vy+=gravity;player.y+=player.vy;if(player.y>=500){player.y=500;player.vy=0;player.onGround=true}for(let ob of obstacles){ob.x-=speed;if(player.x<ob.x+ob.w&&player.x+player.w>ob.x&&player.y<ob.y+ob.h&&player.y+player.h>ob.y){gameOver=true}}obstacles=obstacles.filter(ob=>ob.x+ob.w>0);score+=1;if(score%300===0)speed+=0.5;scoreEl.textContent=Math.floor(score/10)}function draw(){ctx.clearRect(0,0,360,640);ctx.fillStyle="#8B4513";ctx.fillRect(0,530,360,110);ctx.fillStyle="#4CAF50";ctx.fillRect(0,530,360,10);ctx.fillStyle="#FF5722";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle="#fff";ctx.fillRect(player.x+18,player.y+5,6,6);ctx.fillStyle="#333";for(let ob of obstacles){ctx.fillRect(ob.x,ob.y,ob.w,ob.h)}if(gameOver){ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,360,640);ctx.fillStyle="#fff";ctx.font="bold 28px sans-serif";ctx.fillText("GAME OVER",90,300);ctx.font="16px sans-serif";ctx.fillText("Tap untuk main lagi",105,330)}}function loop(){update();draw();requestAnimationFrame(loop)}function jump(){if(gameOver){reset();return}if(player.onGround){player.vy=-14;player.onGround=false}}window.addEventListener('keydown',e=>{if(e.code==='Space')jump()});canvas.addEventListener('touchstart',jump);canvas.addEventListener('mousedown',jump);loop();</script></body></html>
